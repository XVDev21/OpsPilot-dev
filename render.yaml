databases:
  - name: opspilot-db
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: opspilot-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py purge_expired_runs
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-db
          property: connectionString
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_ISSUER
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_WEBHOOK_SECRET
        sync: false
      - key: WORKOS_INVITATION_EXPIRY_DAYS
        value: "14"
      - key: GEMINI_API_KEY
        sync: false
      - key: PROVIDER_CREDENTIAL_ENCRYPTION_KEYS
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: AI_DEFAULT_PROVIDER
        value: gemini
      - key: AI_PLATFORM_PROVIDERS
        value: gemini
      - key: AI_DEFAULT_INTELLIGENCE
        value: fast
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: AI_RATE_LIMIT_PER_DAY
        value: "30"
      - key: WORKFLOW_RETENTION_DAYS
        value: "30"
      - key: CASE_EVIDENCE_UPLOADS_ENABLED
        value: "true"
      - key: CASE_EVIDENCE_MAX_BYTES
        value: "8388608"
      - key: CASE_EVIDENCE_MAX_PIXELS
        value: "10000000"
      - key: CASE_EVIDENCE_MAX_PER_CASE
        value: "20"
      - key: CASE_EVIDENCE_MAX_WORKSPACE_ITEMS
        value: "200"
      - key: CASE_EVIDENCE_MAX_WORKSPACE_BYTES
        value: "536870912"
      - key: CASE_ASSESSMENT_MAX_IMAGES
        value: "8"
      - key: CASE_ASSESSMENT_MAX_IMAGE_BYTES
        value: "25165824"
      - key: CASE_EVIDENCE_S3_BUCKET
        sync: false
      - key: CASE_EVIDENCE_S3_REGION
        sync: false
      - key: CASE_EVIDENCE_S3_ENDPOINT_URL
        sync: false
      - key: CASE_EVIDENCE_S3_ACCESS_KEY
        sync: false
      - key: CASE_EVIDENCE_S3_SECRET_KEY
        sync: false
