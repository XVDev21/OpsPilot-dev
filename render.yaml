databases:
  - name: opspilot-db
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: opspilot-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py purge_expired_runs
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-db
          property: connectionString
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_ISSUER
        value: https://api.workos.com
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PROVIDER_CREDENTIAL_ENCRYPTION_KEYS
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: AI_DEFAULT_PROVIDER
        value: gemini
      - key: AI_DEFAULT_INTELLIGENCE
        value: fast
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: AI_RATE_LIMIT_PER_DAY
        value: "30"
      - key: WORKFLOW_RETENTION_DAYS
        value: "30"
